  <rect x="480" y="418" width="220" height="28" rx="5" fill="rgba(0,0,0,0.25)"/>
  <text x="590" y="436" text-anchor="middle" fill="white" font-size="11" font-weight="600">PrismaService (inyectado)</text>
  <text x="590" y="475" text-anchor="middle" fill="rgba(255,255,255,0.65)" font-size="9">@nestjs/mapped-types · class-validator · class-transformer</text>

  <!-- Arrow Backend → Prisma -->
  <line x1="590" y1="450" x2="590" y2="498" stroke="#2d3748" stroke-width="2.5" marker-end="url(#arrowDark)"/>

  <!-- ===== PRISMA ORM BOX ===== -->
  <rect x="470" y="500" width="240" height="65" rx="10" fill="url(#prismaGrad)" filter="url(#shadow)"/>
  <text x="590" y="522" text-anchor="middle" fill="white" font-size="13" font-weight="700">Prisma ORM v7.5.0</text>
  <text x="590" y="538" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-size="10">schema.prisma · migrations · prisma.config.ts</text>
  <text x="590" y="553" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="9">PrismaPg Adapter · @prisma/adapter-pg</text>

  <!-- Arrow Prisma → DB -->
  <line x1="710" y1="533" x2="758" y2="533" stroke="#336791" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="734" y="525" text-anchor="middle" fill="#336791" font-size="9" font-weight="600">SQL</text>

