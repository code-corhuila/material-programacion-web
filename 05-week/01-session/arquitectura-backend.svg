  <text x="890" y="180" text-anchor="middle" fill="white" font-size="14" font-weight="700">PostgreSQL 16</text>
  <text x="890" y="198" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-size="11">port 5432 (Alpine)</text>
