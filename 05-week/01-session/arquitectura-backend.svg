  <!-- Page background -->
  <rect width="1060" height="740" fill="#f0f4fa" rx="14"/>

  <!-- ===== HEADER ===== -->
  <rect x="0" y="0" width="1060" height="72" fill="url(#headerGrad)" rx="14"/>
  <rect x="0" y="52" width="1060" height="20" fill="url(#headerGrad)"/>
  <text x="530" y="30" text-anchor="middle" fill="white" font-size="20" font-weight="700" letter-spacing="0.5">Arquitectura del Sistema de Gestión Académica</text>
  <text x="530" y="55" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-size="13">NestJS 10 · Next.js 15 · React 19 · PostgreSQL 16 · Prisma 7 · Docker · Node.js 22</text>

  <!-- ===== DOCKER COMPOSE BOX ===== -->
  <rect x="20" y="85" width="1020" height="490" fill="url(#dockerGrad)" rx="14" stroke="#2496ed" stroke-width="2.5" stroke-dasharray="8,4" filter="url(#shadow)"/>
  <rect x="20" y="85" width="200" height="28" fill="#2496ed" rx="14"/>
  <rect x="20" y="99" width="200" height="14" fill="#2496ed"/>
  <text x="34" y="104" fill="white" font-size="13" font-weight="700">🐳  Docker Compose</text>
  <text x="530" y="560" text-anchor="middle" fill="#2496ed" font-size="11" font-style="italic">gestion_academica_net — red interna bridge</text>

  <!-- ===== BROWSER ===== -->
  <rect x="40" y="105" width="140" height="120" rx="10" fill="url(#browserGrad)" filter="url(#shadow)"/>
  <text x="110" y="138" text-anchor="middle" fill="white" font-size="26">🌐</text>
  <text x="110" y="160" text-anchor="middle" fill="white" font-size="13" font-weight="700">Navegador</text>
  <text x="110" y="177" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-size="11">localhost:3000</text>
  <rect x="58" y="186" width="104" height="22" rx="5" fill="rgba(255,255,255,0.2)"/>
  <text x="110" y="201" text-anchor="middle" fill="white" font-size="10" font-weight="600">HTTP Requests</text>

  <!-- Arrow Browser → Frontend -->
  <line x1="180" y1="165" x2="218" y2="165" stroke="#48bb78" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text x="199" y="157" text-anchor="middle" fill="#2f855a" font-size="10" font-weight="600">GET/POST</text>

  <!-- ===== FRONTEND BOX ===== -->
  <rect x="220" y="105" width="185" height="200" rx="10" fill="url(#frontendGrad)" filter="url(#shadow)"/>
  <text x="312" y="130" text-anchor="middle" fill="white" font-size="12" font-weight="700" letter-spacing="1">FRONTEND</text>
  <text x="312" y="150" text-anchor="middle" fill="rgba(255,255,255,0.95)" font-size="24">▲</text>
  <text x="312" y="174" text-anchor="middle" fill="white" font-size="13" font-weight="700">Next.js 15.5.14</text>
  <text x="312" y="191" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-size="10">React 19.2.4 · TypeScript 5</text>
  <text x="312" y="207" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-size="10">App Router · Tailwind CSS 3</text>
  <text x="312" y="223" text-anchor="middle" fill="rgba(255,255,255,0.75)" font-size="10">port 3000</text>
  <!-- Frontend sub-items -->
  <line x1="230" y1="233" x2="396" y2="233" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <text x="245" y="251" fill="rgba(255,255,255,0.9)" font-size="10" font-weight="600">📁 src/app/</text>
  <text x="245" y="266" fill="rgba(255,255,255,0.8)" font-size="9">8 páginas (dashboard)</text>
  <text x="245" y="283" fill="rgba(255,255,255,0.9)" font-size="10" font-weight="600">📁 src/services/</text>
  <text x="245" y="298" fill="rgba(255,255,255,0.8)" font-size="9">8 servicios HTTP</text>

  <!-- Arrow Frontend → Backend -->
  <line x1="405" y1="185" x2="468" y2="185" stroke="#3498db" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="437" y="177" text-anchor="middle" fill="#2980b9" font-size="10" font-weight="600">REST API</text>
  <text x="437" y="199" text-anchor="middle" fill="#7f8c8d" font-size="9">/api/v1</text>

  <!-- ===== BACKEND BOX ===== -->
  <rect x="470" y="105" width="240" height="380" rx="10" fill="url(#backendGrad)" filter="url(#shadow)"/>
  <text x="590" y="130" text-anchor="middle" fill="white" font-size="12" font-weight="700" letter-spacing="1">BACKEND — NestJS 10</text>
  <text x="590" y="152" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-size="11">TypeScript · REST API · port 3001</text>
  <line x1="480" y1="160" x2="700" y2="160" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
  <!-- NestJS layers -->
  <text x="485" y="178" fill="rgba(255,255,255,0.75)" font-size="10">main.ts — GlobalPrefix: api/v1</text>
  <text x="485" y="193" fill="rgba(255,255,255,0.75)" font-size="10">ValidationPipe · CORS · HttpFilter</text>

  <!-- Common Module -->
  <rect x="480" y="200" width="220" height="52" rx="7" fill="url(#commonGrad)"/>
  <text x="590" y="218" text-anchor="middle" fill="white" font-size="11" font-weight="700">Common Module</text>
  <text x="590" y="233" text-anchor="middle" fill="rgba(255,255,255,0.85)" font-size="10">HttpExceptionFilter · ResponseInterceptor</text>
  <text x="590" y="246" text-anchor="middle" fill="rgba(255,255,255,0.75)" font-size="9">Respuesta global: {statusCode, message, data}</text>

  <!-- 8 Modules grid -->
  <text x="590" y="272" text-anchor="middle" fill="white" font-size="11" font-weight="700">8 Módulos CRUD</text>
  <line x1="480" y1="278" x2="700" y2="278" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <!-- Column 1 -->
  <rect x="481" y="284" width="104" height="22" rx="4" fill="rgba(255,255,255,0.15)"/>
  <text x="533" y="299" text-anchor="middle" fill="white" font-size="10">👨‍🎓 estudiantes</text>
  <rect x="481" y="311" width="104" height="22" rx="4" fill="rgba(255,255,255,0.15)"/>
  <text x="533" y="326" text-anchor="middle" fill="white" font-size="10">👨‍🏫 docentes</text>
  <rect x="481" y="338" width="104" height="22" rx="4" fill="rgba(255,255,255,0.15)"/>
  <text x="533" y="353" text-anchor="middle" fill="white" font-size="10">🏫 programas</text>
  <rect x="481" y="365" width="104" height="22" rx="4" fill="rgba(255,255,255,0.15)"/>
  <text x="533" y="380" text-anchor="middle" fill="white" font-size="10">📚 asignaturas</text>
  <!-- Column 2 -->
  <rect x="591" y="284" width="104" height="22" rx="4" fill="rgba(255,255,255,0.15)"/>
  <text x="643" y="299" text-anchor="middle" fill="white" font-size="10">📅 periodos</text>
  <rect x="591" y="311" width="104" height="22" rx="4" fill="rgba(255,255,255,0.15)"/>
  <text x="643" y="326" text-anchor="middle" fill="white" font-size="10">🔗 asignaciones</text>
  <rect x="591" y="338" width="104" height="22" rx="4" fill="rgba(255,255,255,0.15)"/>
  <text x="643" y="353" text-anchor="middle" fill="white" font-size="10">📋 matriculas</text>
  <rect x="591" y="365" width="104" height="22" rx="4" fill="rgba(255,255,255,0.15)"/>
  <text x="643" y="380" text-anchor="middle" fill="white" font-size="10">🎯 calificaciones</text>

  <!-- Arch per module -->
  <line x1="480" y1="393" x2="700" y2="393" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="590" y="410" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-size="9">Controller → Service → Repository</text>
