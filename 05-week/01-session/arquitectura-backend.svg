  <line x1="890" y1="450" x2="890" y2="462" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" stroke-dasharray="3,2"/>
  <rect x="790" y="462" width="200" height="36" rx="8" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <text x="890" y="480" text-anchor="middle" fill="white" font-size="11" font-weight="700">📦 Volume: postgres_data</text>
  <text x="890" y="494" text-anchor="middle" fill="rgba(255,255,255,0.75)" font-size="9">Datos persistentes en Docker</text>
