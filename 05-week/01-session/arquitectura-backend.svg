  <text x="890" y="368" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="9">Estudiante ─┬─ ProgramaAcademico</text>
  <text x="890" y="383" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="9">Asignatura ─┘─ ProgramaAcademico</text>
  <text x="890" y="398" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="9">AsignacionDocente ═ Docente+Asig+Periodo</text>
  <text x="890" y="413" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="9">Matricula ═ Estudiante + AsignacionDocente</text>
  <text x="890" y="428" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-size="9">Calificacion ─ Matricula</text>
