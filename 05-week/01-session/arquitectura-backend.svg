  <rect x="775" y="307" width="115" height="20" rx="5" fill="rgba(255,255,255,0.15)"/>
  <text x="832" y="321" text-anchor="middle" fill="white" font-size="10">Matricula</text>
  <rect x="900" y="307" width="110" height="20" rx="5" fill="rgba(255,255,255,0.15)"/>
  <text x="955" y="321" text-anchor="middle" fill="white" font-size="10">Calificacion</text>
