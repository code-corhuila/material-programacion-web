  <rect x="790" y="503" width="200" height="26" rx="5" fill="rgba(72,187,120,0.2)" stroke="#48bb78" stroke-width="1"/>
  <text x="890" y="520" text-anchor="middle" fill="#48bb78" font-size="10" font-weight="600">✅ healthcheck: pg_isready</text>

  <!-- ===== DOCKER VOLUMES + ENV block ===== -->
  <rect x="40" y="580" width="690" height="58" rx="8" fill="white" stroke="#e0e0e0" stroke-width="1.5"/>
  <text x="46" y="598" fill="#1e3c72" font-size="11" font-weight="700">📄 .env (raíz)</text>
  <text x="46" y="616" fill="#555" font-size="10">DATABASE_URL · DB_USER · DB_PASSWORD · DB_NAME · FRONTEND_URL · PORT</text>
  <text x="46" y="630" fill="#888" font-size="9">Leída por docker-compose.yml y prisma.config.ts (dotenv)</text>
  <text x="420" y="598" fill="#2496ed" font-size="11" font-weight="700">🐳 Servicios Docker</text>
